name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - staging

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Validar sintaxe Python
        run: |
          python -m py_compile todo_project/run.py

      - name: Teste Unitario
        run: |
          echo "Executando testes unitarios"

      - name: Teste de Integracao
        run: |
          echo "Executando testes de integracao"

      - name: Teste Funcional
        run: |
          echo "Executando testes funcionais"

      - name: SAST com Bandit
        run: |
          pip install bandit
          bandit -r todo_project -ll || true

      - name: Analise de dependencias
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  deploy-stage:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Simulando deploy em Stage
        run: |
          echo "Aplicacao implantada em ambiente Stage"

  dast:

    needs: deploy-stage

    runs-on: ubuntu-latest

    steps:

      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Executando DAST com OWASP ZAP
        run: |
          docker run --rm ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
                    -t https://example.com || true